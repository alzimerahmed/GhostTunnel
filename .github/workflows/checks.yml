name: Checks

on:
  workflow_call:
    inputs:
      run_checks:
        description: Run the test suites
        required: false
        default: true
        type: boolean

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: ${{ matrix.name }}
    if: inputs.run_checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Apple tests
            suite: apple
            runner: macos-26
            timeout_minutes: 10
          - name: Apple build
            suite: apple-build
            runner: macos-26
            timeout_minutes: 25
          - name: Apple build tvOS
            suite: apple-build-tvos
            runner: macos-26
            timeout_minutes: 25
          - name: Apple build watchOS
            suite: apple-build-watchos
            runner: macos-26
            timeout_minutes: 25
          - name: Partout tests
            suite: partout
            runner: macos-26
            timeout_minutes: 10
          - name: Cross checks
            suite: cross
            runner: ubuntu-latest
            timeout_minutes: 2
          - name: Cross build
            suite: cross-build
            runner: ubuntu-latest
            timeout_minutes: 45
          - name: Android checks
            suite: android
            runner: ubuntu-latest
            timeout_minutes: 45
          - name: Config checks
            suite: config
            runner: ubuntu-latest
            timeout_minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: partout-io/action-prepare-xcode-build@master
        if: matrix.suite == 'apple' || matrix.suite == 'apple-build' || matrix.suite == 'apple-build-tvos' || matrix.suite == 'apple-build-watchos' || matrix.suite == 'partout'
        with:
          access-token: ${{ github.token }}
          submodules: true

      - uses: partout-io/setup-zig@main
        if: matrix.suite == 'partout' || matrix.suite == 'android' || matrix.suite == 'cross-build'

      - uses: actions/setup-go@v7
        if: matrix.suite == 'android'
        with:
          go-version: 1.24
          # cache: false — a cache-dependency-path glob that resolves to
          # zero files hard-fails setup-go; whether partout/src has go.sum
          # on the pinned commit is not verifiable statically.
          cache: false

      - uses: actions/setup-java@v6
        if: matrix.suite == 'android'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v4
        if: matrix.suite == 'android'
        with:
          packages: platform-tools

      - name: Install Android SDK components
        if: matrix.suite == 'android'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;4.1.2" \
            "ndk;29.0.14206865"

      - name: Run Android checks
        if: matrix.suite == 'android'
        run: bash app-android/ci/run-checks.sh

      - uses: actions/setup-node@v6
        if: matrix.suite == 'api'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Verify CMake file lists
        if: matrix.suite == 'cross'
        run: |
          app-cross/scripts/gen-cmake-files.sh
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      # Phase 13 gate: real desktop build (tunnel binary + wxWidgets app).
      # build.sh drives CMake directly (presets exist for editor use) and
      # downloads the partout prebuilts pinned in .prebuilts-version.
      - name: Install desktop toolchain deps
        if: matrix.suite == 'cross-build'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libwxgtk3.2-dev libgtk-3-dev

      - name: Build desktop app
        if: matrix.suite == 'cross-build'
        run: bash app-cross/scripts/build.sh -gen -app

      - name: Upload desktop binary
        if: matrix.suite == 'cross-build'
        uses: actions/upload-artifact@v4
        with:
          name: ghosttunnel-desktop-linux
          path: app-cross/dist/
          if-no-files-found: error

      - name: Validate hosted config
        if: matrix.suite == 'config'
        run: bash scripts/validate-config.sh config/example.json

      - name: Validate translations
        if: matrix.suite == 'apple'
        run: app-apple/scripts/clean-translations.sh

      - name: Run Apple tests
        if: matrix.suite == 'apple'
        run: ci/run-apple-tests.sh

      - name: Run Apple build
        if: matrix.suite == 'apple-build'
        run: |
          cd app-apple
          xcodebuild build \
            -project Passepartout.xcodeproj \
            -scheme Passepartout \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO | tail -50
          xcodebuild build \
            -project Passepartout.xcodeproj \
            -scheme PassepartoutMac \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | tail -50

      - name: Run Apple build (tvOS)
        if: matrix.suite == 'apple-build-tvos'
        run: |
          cd app-apple
          # Phase 11 gate: compiles the tvOS app + the appletvos-filtered
          # PassepartoutTopShelf extension target (hand-written pbxproj).
          xcodebuild build \
            -project Passepartout.xcodeproj \
            -scheme Passepartout \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO | tail -50

      # Phase 14 gate: compiles the hand-written watchOS companion targets
      # (app + complication widget extension). The iOS build leg above also
      # builds PassepartoutWatch via its ios-filtered target dependency.
      - name: Run Apple build (watchOS)
        if: matrix.suite == 'apple-build-watchos'
        run: |
          cd app-apple
          xcodebuild build \
            -project Passepartout.xcodeproj \
            -target PassepartoutWatch \
            -sdk watchos \
            CODE_SIGNING_ALLOWED=NO | tail -50
          xcodebuild build \
            -project Passepartout.xcodeproj \
            -target PassepartoutWatchWidgets \
            -sdk watchos \
            CODE_SIGNING_ALLOWED=NO | tail -50

      - name: Run Partout tests (Swift)
        if: matrix.suite == 'partout'
        run: ci/run-partout-swift-tests.sh

      - name: Run Partout tests
        if: matrix.suite == 'partout'
        run: ci/run-partout-tests.sh

      - name: Run API tests
        if: matrix.suite == 'api'
        run: ci/run-api-tests.sh

  skip_checks:
    name: Checks skipped
    if: ${{ !inputs.run_checks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "Checks disabled for this run"
