name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build artifacts for (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  partout_xcframework:
    name: Partout XCFramework
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: partout-io/action-prepare-xcode-build@master
        with:
          access-token: ${{ github.token }}
          submodules: true

      - uses: partout-io/setup-zig@main

      - uses: actions/setup-go@v7
        with:
          go-version: 1.24
          cache-dependency-path: partout/src/**/go.sum

      - name: Build Partout XCFramework
        run: |
          cd app-apple
          prebuilts_version=$(tr -d '\r\n' < ../.prebuilts-version)
          ../partout/scripts/build-xcframework.sh \
            "$prebuilts_version" \
            --out "$PWD/PartoutNative.xcframework" \
            --prebuilts-out "$RUNNER_TEMP/partout-prebuilts" \
            --full

      - uses: actions/upload-artifact@v4
        with:
          name: partout-native
          path: app-apple/PartoutNative.xcframework
          if-no-files-found: error

  apple-artifacts:
    name: Build unsigned Apple artifacts
    needs: partout_xcframework
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: partout-io/action-prepare-xcode-build@master
        with:
          access-token: ${{ github.token }}
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: partout-native
          path: app-apple/PartoutNative.xcframework

      - name: Build iOS app (unsigned)
        run: |
          cd app-apple
          set -o pipefail
          xcodebuild build \
            -project Passepartout.xcodeproj \
            -scheme Passepartout \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData/iOS \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -30

      - name: Build macOS app (unsigned)
        run: |
          cd app-apple
          set -o pipefail
          xcodebuild build \
            -project Passepartout.xcodeproj \
            -scheme PassepartoutMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData/macOS \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -30

      - name: Package artifacts
        run: |
          cd app-apple
          mkdir -p ../artifacts
          find DerivedData -name '*.app' -maxdepth 4
          ios_app=$(find DerivedData/iOS/Build/Products -name '*.app' -maxdepth 2 \
            | grep -vE 'Watch|LoginItem|Tests' | head -1)
          mac_app=$(find DerivedData/macOS/Build/Products -name '*.app' -maxdepth 2 \
            | grep -vE 'Watch|LoginItem|Tests' | head -1)
          echo "ios_app=$ios_app"
          echo "mac_app=$mac_app"
          test -n "$ios_app"
          test -n "$mac_app"
          mkdir -p ipa/Payload
          cp -R "$ios_app" ipa/Payload/
          (cd ipa && zip -qr "../../artifacts/GhostTunnel-iOS-$(git describe --tags).ipa" Payload)
          ditto -c -k --keepParent "$mac_app" "../artifacts/GhostTunnel-macOS-$(git describe --tags).zip"
          ls -la ../artifacts

      - name: Attach artifacts to release
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          for f in artifacts/*; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          gh release upload "$tag" artifacts/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  android-artifacts:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: partout-io/setup-zig@main

      - uses: actions/setup-go@v7
        with:
          go-version: 1.24
          cache: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;4.1.2" \
            "ndk;29.0.14206865"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/ghosttunnel-release.jks"
          ls -la "$RUNNER_TEMP/ghosttunnel-release.jks"

      - name: Build signed release APK
        working-directory: app-android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ghosttunnel-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          find app/build/outputs/apk -name '*.apk'

      - name: Attach APK to release
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          apk=$(find app-android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk"
          out="GhostTunnel-Android-$(git describe --tags).apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          gh release upload "$tag" "$out" "$out.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
